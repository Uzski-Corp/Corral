# Local Corral stack. From the repo root:
#   docker compose up --build
#
# App  http://localhost:3010   (host port 3000 is often already taken; override with WEB_PORT)
# API  http://localhost:8000/docs
#
# Postgres and Redis match server/.env.example (user/password/db: corral).
# If server/.env exists, Compose loads it (WorkOS keys). The URLs below still
# win, so the containers talk to each other on the Compose network while the
# browser keeps using localhost.
#
# Postgres is published on host port 5433 so it does not collide with a
# Postgres already bound to 5432. From the host: localhost:5433.
# Override with POSTGRES_HOST_PORT=5432 docker compose up --build.
#
# API and worker use fixed addresses on this network. Service DNS for the
# name "postgres" was failing (migrations died with "Name or service not
# known") before the process could listen, so /readyz never ran.
# After pulling this file, recreate the network once:
#   docker compose down && docker compose up --build

name: corral

x-api-env: &api-env
  APP_ENV: local
  DATABASE_URL: postgresql+asyncpg://corral:corral@172.31.210.10:5432/corral
  REDIS_URL: redis://172.31.210.11:6379/0
  FRONTEND_URL: http://localhost:${WEB_PORT:-3010}
  CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3010}"]'
  WORKOS_REDIRECT_URI: http://localhost:8000/api/v1/auth/callback
  CORRAL_IN_COMPOSE: "1"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: corral
      POSTGRES_USER: corral
      POSTGRES_PASSWORD: corral
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.31.210.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corral -d corral"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      default:
        ipv4_address: 172.31.210.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    image: corral-api:local
    env_file:
      - path: ./server/.env
        required: false
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    extra_hosts:
      - "postgres:172.31.210.10"
      - "redis:172.31.210.11"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness is GET /healthz. This check is readiness: DB + Redis, GET /readyz.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  worker:
    build:
      context: ./server
    image: corral-api:local
    command: ["arq", "app.worker.main.WorkerSettings"]
    env_file:
      - path: ./server/.env
        required: false
    environment:
      <<: *api-env
    extra_hosts:
      - "postgres:172.31.210.10"
      - "redis:172.31.210.11"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${WEB_PORT:-3010}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.210.0/24
