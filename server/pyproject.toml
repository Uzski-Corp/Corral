[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::sqlalchemy.exc.SADeprecationWarning",
    # arq 0.28 calls redis' deprecated close(); harmless, fixed upstream.
    "ignore:Call to deprecated close:DeprecationWarning:arq.worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "SIM117"]
# Migrations interpolate module constants into DDL only; never user input.
"migrations/versions/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query"]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs driver calls in greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*", "arq.*", "fakeredis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
